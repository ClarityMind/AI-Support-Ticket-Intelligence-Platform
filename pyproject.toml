[project]
name = "ai-support-ticket-intelligence-platform"
version = "0.1.0"
description = "Reproducible classical ML baselines for support queue and priority classification"
readme = "README.md"
authors = [
    { name = "CM" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "joblib>=1.5.3",
]

[project.scripts]
support-ticket-ml = "ai_support_ticket_intelligence_platform.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
